pack:
  # Отправлять ресурспак игрокам при входе
  send-on-join: true
  # Публичный адрес сервера (IP или домен), по которому игроки скачают пак
  host: "127.0.0.1"
  # Порт встроенного HTTP-сервера раздачи (его нужно открыть в фаерволе/панели хостинга)
  port: 8085
  # Принудительный пак (кик при отказе)
  force: false
  prompt: "Ресурспак сервера"
  # Если в plugins/Artisan/pack/ нет своего pack.mcmeta, он создаётся автоматически.
  # Значение pack_format подставь под актуальную версию клиента 26.3.
  pack-format: 75
  description: "Artisan resource pack"
